components:
  schemas:
    AlertsActionV1:
      description: "An available action: operationId targets an inbox operation with\
        \ this item id; process actions provide a complete href."
      properties:
        href:
          type: "string"
        label:
          type: "string"
        name:
          type: "string"
        operationId:
          type: "string"
        processName:
          type: "string"
      type: "object"
    AlertsErrorV1:
      description: "Deprecated since 1.2.0: errors use BasicErrorResponseV1."
      properties:
        error:
          nullable: true
          type: "string"
      type: "object"
    AlertsFollowV1:
      description: "Capability discovery only. Next obtains the follow URL from its\
        \ collaboration module."
      properties:
        available:
          description: "True exactly when the collaboration UI API extension is registered."
          type: "boolean"
      type: "object"
    AlertsInboxItemV1:
      description: "A notification recipient. body is included only in page items\
        \ and banners; alertId only for ALERT notifications."
      properties:
        actions:
          items:
            $ref: "#/components/schemas/AlertsActionV1"
          type: "array"
        age:
          type: "string"
        alertId:
          nullable: true
          type: "integer"
        body:
          nullable: true
          type: "string"
        category:
          nullable: true
          type: "string"
        deliveredAt:
          nullable: true
          type: "string"
        href:
          description: "Existing safe link, or null."
          nullable: true
          type: "string"
        id:
          type: "integer"
        linkLabel:
          nullable: true
          type: "string"
        notificationId:
          type: "integer"
        severity:
          nullable: true
          type: "string"
        source:
          nullable: true
          type: "string"
        sticky:
          type: "boolean"
        title:
          nullable: true
          type: "string"
        unread:
          type: "boolean"
      type: "object"
    AlertsInboxPageV1:
      description: "Filtered notification page."
      properties:
        items:
          items:
            $ref: "#/components/schemas/AlertsInboxItemV1"
          type: "array"
        limit:
          type: "integer"
        offset:
          type: "integer"
        total:
          type: "integer"
      type: "object"
    AlertsInboxSummaryV1:
      description: "Bell summary, latest ten items and up to three sticky banners."
      properties:
        alertsHref:
          type: "string"
        banners:
          items:
            $ref: "#/components/schemas/AlertsInboxItemV1"
          type: "array"
        highestUnreadSeverity:
          nullable: true
          type: "string"
        inboxHref:
          description: "Canonical inbox navigation link."
          type: "string"
        items:
          items:
            $ref: "#/components/schemas/AlertsInboxItemV1"
          type: "array"
        notificationsHref:
          description: "Existing notifications page link; retained for compatibility."
          type: "string"
        pollSeconds:
          type: "integer"
        preferencesSection:
          description: "Name of the user Preferences section for notification settings\
            \ (/qqq/v1/preferences/{name}), or null when not registered."
          nullable: true
          type: "string"
        unreadCount:
          type: "integer"
      type: "object"
    AlertsInboxTargetV1:
      description: "Select id, nonempty ids (first 500), legacy alertId, or all:true\
        \ in that precedence. All scans are capped at 1000 rows."
      properties:
        alertId:
          type: "integer"
        all:
          type: "boolean"
        id:
          type: "integer"
        ids:
          items:
            type: "integer"
          type: "array"
      type: "object"
    AlertsMutationResultV1:
      description: "Number of the caller own recipient rows changed."
      properties:
        updated:
          type: "integer"
      type: "object"
    AlertsPanelAlertV1:
      description: "A visible open alert with permission-aware process actions."
      properties:
        actions:
          items:
            $ref: "#/components/schemas/AlertsActionV1"
          type: "array"
        age:
          type: "string"
        alertId:
          type: "integer"
        group:
          nullable: true
          type: "string"
        href:
          type: "string"
        raisedAt:
          nullable: true
          type: "string"
        severity:
          nullable: true
          type: "string"
        status:
          nullable: true
          type: "string"
        title:
          nullable: true
          type: "string"
      type: "object"
    AlertsRecordPanelV1:
      description: "Open alerts, recent resolutions and collaboration capability.\
        \ watching is deprecated legacy subscription state."
      properties:
        canManage:
          type: "boolean"
        follow:
          $ref: "#/components/schemas/AlertsFollowV1"
        open:
          items:
            $ref: "#/components/schemas/AlertsPanelAlertV1"
          type: "array"
        openCount:
          type: "integer"
        resolvedLast30Days:
          type: "integer"
        viewAllHref:
          nullable: true
          type: "string"
        visible:
          type: "boolean"
        watching:
          description: "Deprecated: existing RECORD subscriptions only; does not represent\
            \ collaboration follow state."
          type: "boolean"
      type: "object"
    AlertsUnreadTargetV1:
      description: "Select id or nonempty ids (first 500), in that precedence. Legacy\
        \ alertId is also accepted for compatibility. all is not supported."
      properties:
        alertId:
          type: "integer"
        id:
          type: "integer"
        ids:
          items:
            type: "integer"
          type: "array"
      type: "object"
    BasicErrorResponseV1:
      description: "The error body of every UI API operation (core and extensions)."
      properties:
        error:
          description: "The error message (the same as message; kept for clients of\
            \ UI API 1.0 to 1.5)."
          type: "string"
        code:
          description: "A stable, machine-readable code. Well-known values: BAD_REQUEST\
            \ (400), UNAUTHENTICATED (401),\nPERMISSION_DENIED (403), NOT_FOUND (404),\
            \ CONFLICT (409), RATE_LIMITED (429), INTERNAL_ERROR (500),\nERROR (other).\
            \ Extensions may add codes; treat an unknown code by the HTTP status.\
            \ Since 1.6.0."
          type: "string"
        message:
          description: "A message to show the user. Since 1.6.0."
          type: "string"
        fieldErrors:
          description: "Errors about particular request fields, when known. Since\
            \ 1.6.0."
          items:
            properties:
              field:
                description: "The field (or parameter) name."
                type: "string"
              message:
                description: "The error about that field."
                type: "string"
              code:
                description: "An optional machine-readable code, e.g. REQUIRED, TOO_LONG,\
                  \ PATTERN."
                type: "string"
            type: "object"
          type: "array"
        traceId:
          description: "Identifies this request in the server logs (also the X-QQQ-Trace-Id\
            \ response header); quote it when reporting a problem. Since 1.6.0."
          type: "string"
      type: "object"
  securitySchemes:
    sessionUuidCookie:
      description: "The session cookie set by POST /qqq/v1/manageSession (web clients)."
      in: "cookie"
      name: "sessionUUID"
      type: "apiKey"
    bearerAuth:
      bearerFormat: "JWT or session UUID"
      description: "`Authorization: Bearer <token>`, where the token is either\n-\
        \ an OAuth2 access token (a signed JWT) issued by the app's identity provider\
        \ to the app's client,\n  or to its native client (`values.nativeClientId`\
        \ in GET /qqq/v1/metaData/authentication), for\n  example from the device-authorization\
        \ grant or auth-code + PKCE. It is verified against the\n  provider's keys\
        \ (issuer, audience, expiry, signature) and gives the same user and permissions\n\
        \  as signing in on the web. When it expires (401), refresh it at the provider\
        \ and retry; or\n- a session UUID returned by POST /qqq/v1/manageSession,\
        \ which the server keeps refreshed."
      scheme: "bearer"
      type: "http"
    oauth2:
      description: "The app's OAuth2 / OpenID Connect provider. The real endpoints\
        \ come from the provider's discovery\ndocument: `{values.baseUrl}.well-known/openid-configuration`,\
        \ with values from\nGET /qqq/v1/metaData/authentication. Native clients use\
        \ `values.nativeClientId` (a public client)\nwith auth-code + PKCE (loopback\
        \ or custom-scheme redirect URI registered at the provider) or the\ndevice-authorization\
        \ grant (`device_authorization_endpoint`, RFC 8628), then send the access\
        \ token\nas `Authorization: Bearer`."
      flows:
        authorizationCode:
          authorizationUrl: "/authorize"
          scopes:
            email: "Email address"
            offline_access: "A refresh token, to renew the access token without signing\
              \ in again"
            openid: "OpenID Connect sign-in"
            profile: "Name, username and groups (permissions come from the groups)"
          tokenUrl: "/token"
      type: "oauth2"
info:
  contact:
    email: "contact@kingsrook.com"
  description: "Alerts inbox and record panel"
  title: "QQQ Middleware API extension: alerts"
  version: "1.2.0"
openapi: "3.0.3"
paths:
  /qqq/v1/alerts/inbox/summary:
    get:
      description: "Uses the signed-in caller's permissions and record visibility."
      operationId: "alertsInboxSummary"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Sign in required"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Permission denied"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsInboxSummaryV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Read the bell summary"
      tags:
      - "alerts"
  /qqq/v1/alerts/inbox:
    get:
      description: "Uses the signed-in caller's permissions and record visibility."
      operationId: "alertsInbox"
      parameters:
      - description: "all or unread; other values behave as all."
        in: "query"
        name: "status"
        required: false
        schema:
          type: "string"
      - description: "Case-insensitive category filter."
        in: "query"
        name: "category"
        required: false
        schema:
          type: "string"
      - description: "Case-insensitive severity filter."
        in: "query"
        name: "severity"
        required: false
        schema:
          type: "string"
      - description: "Default 0; negatives clamp to 0; malformed values use the default."
        in: "query"
        name: "offset"
        required: false
        schema:
          type: "integer"
      - description: "Default 25; clamped to 1..100; malformed values use the default."
        in: "query"
        name: "limit"
        required: false
        schema:
          type: "integer"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Sign in required"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Permission denied"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsInboxPageV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Page the notification inbox"
      tags:
      - "alerts"
  /qqq/v1/alerts/inbox/read:
    post:
      description: "Uses the signed-in caller's permissions and record visibility."
      operationId: "alertsInboxRead"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertsInboxTargetV1"
        required: true
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Sign in required"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Permission denied"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsMutationResultV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Mark own notifications read"
      tags:
      - "alerts"
  /qqq/v1/alerts/inbox/unread:
    post:
      description: "Uses the signed-in caller's permissions and record visibility."
      operationId: "alertsInboxUnread"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertsUnreadTargetV1"
        required: true
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Sign in required"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Permission denied"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsMutationResultV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Mark own notifications unread"
      tags:
      - "alerts"
  /qqq/v1/alerts/inbox/dismiss:
    post:
      description: "Uses the signed-in caller's permissions and record visibility."
      operationId: "alertsInboxDismiss"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertsInboxTargetV1"
        required: true
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Sign in required"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Permission denied"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsMutationResultV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Dismiss own notifications"
      tags:
      - "alerts"
  /qqq/v1/alerts/record-panel:
    get:
      description: "Uses the signed-in caller's permissions and record visibility."
      operationId: "alertsRecordPanel"
      parameters:
      - description: "Parent table name."
        in: "query"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Parent record key."
        in: "query"
        name: "recordId"
        required: true
        schema:
          type: "string"
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Invalid input"
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Sign in required"
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Permission denied"
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found"
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertsRecordPanelV1"
          description: "Successful Response"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Read visible alerts for a record"
      tags:
      - "alerts"
servers:
- description: "The QQQ server that serves this document (paths include /qqq/v1)."
  url: "/"
tags:
- description: "Operations of the alerts extension."
  name: "alerts"
