name: Release candidate
'on':
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan a cut without changing release state
        type: boolean
        default: false
      finalize:
        description: Retry finalization of an existing cut; do not cut another RC
        type: boolean
        default: false
      merge_sha:
        description: Existing cut merge_sha (finalize retry only)
        type: string
        default: ''
      bump_sha:
        description: Existing cut bump_sha (finalize retry only)
        type: string
        default: ''
      branch:
        description: Existing cut branch (finalize retry only)
        type: string
        default: ''
      version:
        description: Existing cut version (finalize retry only)
        type: string
        default: ''
  pull_request:
    types:
    - closed
    branches:
    - develop
  repository_dispatch:
    types:
    - qbit-rc-published
permissions:
  contents: write
  actions: read
  checks: read
jobs:
  release-rc:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.merged
      == true && github.event.pull_request.base.ref == 'develop' && contains(github.event.pull_request.labels.*.name,
      'release:rc'))
    uses: QRun-IO/qqq-orb/.github/workflows/qbit-release-rc.yml@ee8953bd937d7f69c7a54308ffd5f9aed95aa768
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false
        }}
      finalize: ${{ github.event_name == 'repository_dispatch' || (github.event_name
        == 'workflow_dispatch' && inputs.finalize) }}
      merge_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.merge_sha
        || inputs.merge_sha || '' }}
      bump_sha: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.bump_sha
        || inputs.bump_sha || '' }}
      branch: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch
        || inputs.branch || '' }}
      version: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version
        || inputs.version || '' }}
    secrets: inherit
